# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Clean up abandoned carts (empty carts older than 30 days)
  cleanup_abandoned_carts:
    class: CleanupAbandonedCartsJob
    queue: default
    schedule: at 3am every day

  # Clean up old product views to prevent unbounded table growth
  cleanup_old_product_views:
    command: "ProductView.where('created_at < ?', 90.days.ago).in_batches(of: 1000).delete_all"
    schedule: at 4am every Sunday
